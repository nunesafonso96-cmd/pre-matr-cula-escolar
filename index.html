
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pré-Matrícula Escolar | Escola Lindalva</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f1f5f9;
            color: #1e293b;
        }

        header {
            background: #14532d;
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        header h1 {
            font-size: 25px;
            margin-bottom: 8px;
        }

        main {
            max-width: 850px;
            margin: 40px auto;
            padding: 20px;
        }

        .painel {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            text-align: center;
        }

        .painel h2 {
            color: #14532d;
            margin-bottom: 15px;
        }

        .painel p {
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .botao {
            display: inline-block;
            background: #15803d;
            color: white;
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .botao:hover {
            background: #166534;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #64748b;
        }
    </style>
</head>

<body>

    <header>
        <h1>Escola Municipal Lindalva Maria de Souza</h1>
        <p>Sistema de Pré-Matrícula Escolar</p>
    </header>

    <main>
        <section class="painel">
            <h2>Bem-vindo ao Sistema de Pré-Matrícula</h2>

            <p>
                Utilize este sistema para realizar a pré-matrícula
                dos estudantes da Escola Municipal Lindalva Maria
                de Souza.
            </p>

            <button class="botao" onclick="alert('Em breve: formulário de pré-matrícula!')">
                Iniciar Pré-Matrícula
            </button>
        </section>
    </main>

    <footer>
        Escola Municipal Lindalva Maria de Souza
        <br>
        São Miguel - RN
    </footer>

</body>
</html>
